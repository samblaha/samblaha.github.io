title: "Desktop Labs"
description: "Project-first portfolio"
url: "https://samblaha.github.io"
permalink: pretty

exclude:
  - node_modules/
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - GISCUS-SETUP.md
  - REDESIGN-SUMMARY.md

collections:
  projects:
    output: true
    permalink: /p/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      comments: true
