title: "Blaha Labs"
description: "Project-first portfolio"
url: "https://samblaha.com"
permalink: pretty

exclude:
  - assets/models/garage.blend
  - assets/models/garage.blend1
  - assets/models/ASSET-CONTRACT.md
  - output/
  - design-qa.md
  - node_modules/
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - GISCUS-SETUP.md
  - REDESIGN-SUMMARY.md
  - scripts/

collections:
  projects:
    output: true
    permalink: /p/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      comments: true
